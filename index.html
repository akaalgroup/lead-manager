<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel CRM & WhatsApp Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; margin: 0; }
  </style>
</head>
<body class="text-slate-800">
  <div class="min-h-screen flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-slate-200 p-4 flex flex-col justify-between shrink-0">
      <div>
        <div class="text-white font-bold text-lg px-3 py-2 border-b border-slate-800">TRAVEL CRM</div>
        <nav class="mt-4 space-y-1 text-sm">
          <button onclick="filterStatus('all')" class="w-full text-left px-3 py-2 rounded-lg bg-indigo-600 text-white font-medium">
            Dashboard & Leads
          </button>
          <button onclick="openChatById(1)" class="w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800">
            WhatsApp Inbox
          </button>
          <button onclick="filterStatus('Payment Due')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800">
            Pending Payments
          </button>
        </nav>
      </div>
      <div class="text-xs text-emerald-400 px-3 py-2 border-t border-slate-800">
        ● WhatsApp Ready
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 min-w-0">
      <div class="flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-xl border border-slate-200 mb-6">
        <div class="flex items-center gap-2 flex-1 min-w-[240px]">
          <input id="globalSearch" type="text" placeholder="Search name or WhatsApp number..."
                 class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-indigo-500" />
          <button onclick="searchAndOpenChat()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-medium shrink-0">
            Open Chat
          </button>
        </div>
        <button onclick="openNewLeadModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium">
          + New Inquiry
        </button>
      </div>

      <!-- KPIs -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="bg-white p-4 rounded-xl border border-slate-200">
          <div class="text-xs text-slate-500">Active Leads</div>
          <div id="totalLeadsCount" class="text-2xl font-bold mt-1">0</div>
        </div>
        <div class="bg-white p-4 rounded-xl border border-slate-200">
          <div class="text-xs text-slate-500">WhatsApp
